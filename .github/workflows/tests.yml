name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php: 8.2
            laravel: 12
          - php: 8.3
            laravel: 13

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, gd, json, mbstring, openssl, pdo_sqlite, tokenizer
          coverage: none

      - name: Select Laravel version
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Complete project setup
        run: composer run-script post-create-project-cmd

      - name: Verify application
        run: |
          php artisan about
          php artisan config:cache
          php artisan route:cache
          php .github/scripts/smoke.php
          test -f config/waterhole/system.php
          test -L public/storage
